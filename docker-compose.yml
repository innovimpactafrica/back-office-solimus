# ════════════════════════════════════════════════════════════════════════════════════════════
# PRODUCTION : Dokploy déploie ce backend en mode « Application » (Dockerfile, Swarm).
# CE FICHIER N'Y EST PAS APPLIQUÉ : seules comptent les variables de l'onglet Environment de
# Dokploy, et le domaine api.solimus.sn doit viser le port 8082 du conteneur.
#
# Ce fichier décrit la même réalité, pour le local ou un éventuel passage en mode Compose :
#   - base MySQL EXTERNE (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD), comme en production ;
#   - aucun port publié sur l'hôte : Traefik joint l'API par le réseau externe dokploy-network.
#
# Usage (variables lues dans .env, voir .env.example) :
#   docker network create dokploy-network   # une fois, en local
#   docker compose up -d --build            # base externe
#   MySQL local jetable : docker-compose.local-db.yml (voir son en-tête)
#
# « - VAR=${VAR:?message} » : obligatoire, compose refuse de démarrer sans elle.
# « - VAR »                : facultative, transmise seulement si elle est définie ; absente, la
#                            valeur par défaut de Spring s'applique (une valeur vide l'écraserait).
# ════════════════════════════════════════════════════════════════════════════════════════════
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # ── Base MySQL externe ──
      - DB_HOST=${DB_HOST:?DB_HOST obligatoire (hôte MySQL)}
      - DB_PORT
      - DB_NAME=${DB_NAME:?DB_NAME obligatoire (schéma MySQL)}
      - DB_USER=${DB_USER:?DB_USER obligatoire (utilisateur dédié, pas root)}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD obligatoire}
      - DB_POOL_SIZE
      - DB_CONNECT_TIMEOUT_SECONDS
      - APP_STARTUP_DB_CHECK
      # ── JWT et codes d'activation ──
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obligatoire (32 octets minimum)}
      - JWT_EXPIRATION
      - JWT_REFRESH_EXPIRATION
      - ACTIVATION_CODE_EXPIRATION_MINUTES
      - ACTIVATION_CODE_RESEND_COOLDOWN_SECONDS
      # ── Mail (SMTP) ──
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_FROM
      - MAIL_APP_NAME
      - MAIL_SMTP_AUTH
      - MAIL_SMTP_STARTTLS
      - MAIL_SMTP_STARTTLS_REQUIRED
      - MAIL_SMTP_SSL_TRUST
      # ── URLs publiques (liens e-mail, redirections) ──
      - FRONTEND_BASE_URL
      - BACKEND_BASE_URL
      - FRONTEND_RESET_PASSWORD_URL
      - FRONTEND_ACTIVATION_URL
      - SYNDIC_WEB_APP_REDIRECT_URL
      # ── MinIO ──
      - MINIO_URL
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_BUCKET
      # ── Firebase (JSON du compte de service) ──
      - FIREBASE_SERVICE_ACCOUNT_JSON
      # ── TouchPay (page de paiement hébergée) ──
      - TOUCHPAY_HOSTED_SCRIPT_URL
      - TOUCHPAY_AGENCY_CODE
      - TOUCHPAY_TOKEN
      - TOUCHPAY_DOMAIN_NAME
      - TOUCHPAY_SUCCESS_REDIRECT_URL
      - TOUCHPAY_FAILED_REDIRECT_URL
      - TOUCHPAY_DEFAULT_CITY
      - TOUCHPAY_CALLBACK_URL
      - TOUCHPAY_BRIDGE_URL
      # ── API TouchPay GU (paiements directs Wave / Orange Money) ──
      - GUTOUCH_API_BASE_URL
      - GUTOUCH_AGENCY_CODE
      - GUTOUCH_LOGIN_AGENT
      - GUTOUCH_PASSWORD_AGENT
      - GUTOUCH_DIGEST_USERNAME
      - GUTOUCH_DIGEST_PASSWORD
      - GUTOUCH_HTTP_METHOD
      - GUTOUCH_PARTNER_NAME
      - GUTOUCH_SERVICE_CODE_WAVE
      - GUTOUCH_SERVICE_CODE_OM
      - GUTOUCH_READ_TIMEOUT_MS
      - GUTOUCH_BACKEND_BASE_URL
      - GUTOUCH_SYNDIC_RETURN_URL
      - GUTOUCH_ADMIN_RETURN_URL
      - GUTOUCH_ADMIN_SYNDIC_CREATED_RETURN_URL
      # ── Divers ──
      - GEOLOCATION_SEARCH_RADIUS_KM
      - ADMIN_DEFAULT_EMAIL
      - ADMIN_DEFAULT_PASSWORD
      - JAVA_OPTS
    expose:
      - "8082"
    healthcheck:
      # Liveness seulement : une lenteur de la base partagée ne retire pas l'API du routage.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      # L'API peut être sur plusieurs réseaux : Traefik doit passer par celui qu'il partage avec elle.
      - traefik.docker.network=dokploy-network
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
