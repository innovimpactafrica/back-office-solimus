# ════════════════════════════════════════════════════════════════════════════════════════════
# PostgreSQL LOCAL JETABLE (développement uniquement — jamais en production).
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build
#
# Dans .env : DB_HOST=db, DB_PORT=5432, DB_NAME=solimus_db, DB_USER=<utilisateur>, DB_PASSWORD=<...>
#
# Fichier séparé plutôt qu'un profil « local-db » dans docker-compose.yml : compose évalue ${VAR:?}
# dans TOUS les services, même ceux d'un profil inactif.
# Aucun port publié : PostgreSQL n'est joignable que depuis le réseau local-db.
# ════════════════════════════════════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:?DB_NAME obligatoire}
      - POSTGRES_USER=${DB_USER:?DB_USER obligatoire}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD obligatoire}
    volumes:
      - solimus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - local-db

  app:
    depends_on:
      db:
        condition: service_healthy
    networks:
      - local-db

volumes:
  solimus_db_data:

networks:
  local-db:
