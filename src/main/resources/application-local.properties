# Profil de développement local (hors Docker)
# Utilisation :
#   set -a; source .env; set +a
#   mvn clean spring-boot:run
#
# ATTENTION : ce fichier ne doit contenir AUCUNE ligne spring.datasource.* / jwt.* /
# spring.mail.* / minio.* / touchpay.* — sinon il masque application.properties et le
# local se connecte à la mauvaise base (MySQL Docker localhost:3308/solimus au lieu de
# 89.167.72.116:3303/solimus_db lue en prod).
# Toute la config sensible vient de application.properties + variables du .env chargé.
# Seules les URLs locales du frontend/backend sont surchargées ici.

app.frontend.base-url=http://localhost:4200
app.backend.base-url=http://localhost:8085
app.frontend.reset-password-url=http://localhost:4200/create-password?token=
app.frontend.activation-url=http://localhost:4200/create-password?token=
app.syndic-web-app-redirect-url=http://localhost:4200/app/parametres
