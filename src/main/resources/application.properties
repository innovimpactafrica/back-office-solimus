spring.application.name=solimus
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Base de données PostgreSQL (même base en local et en prod) ──
spring.datasource.url=jdbc:postgresql://${DB_HOST:89.167.72.116}:${DB_PORT:5430}/${DB_NAME:solimus_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Dates enregistrées et relues en UTC, quel que soit le fuseau du serveur
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pool : évite les warnings "Thread starvation" HikariPool de ton terminal
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

server.port=8085

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

logging.level.com.zaxxer.hikari=INFO

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Mail (OVH) ──
spring.mail.host=${MAIL_HOST:ssl0.ovh.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:ssl0.ovh.net}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:contact@solimus.sn}
mail.app.name=${MAIL_APP_NAME:Solimus}

# ── MinIO ──
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# ── TouchPay ──
touchpay.hosted.script-url=${TOUCHPAY_HOSTED_SCRIPT_URL}
touchpay.agency-code=${TOUCHPAY_AGENCY_CODE}
touchpay.token=${TOUCHPAY_TOKEN}
touchpay.hosted.domain-name=${TOUCHPAY_DOMAIN_NAME:solimus.sn}
touchpay.hosted.success-redirect-url=${TOUCHPAY_SUCCESS_REDIRECT_URL}
touchpay.hosted.failed-redirect-url=${TOUCHPAY_FAILED_REDIRECT_URL}
touchpay.hosted.default-city=${TOUCHPAY_DEFAULT_CITY:Dakar}
touchpay.callback-url=${TOUCHPAY_CALLBACK_URL}
app.touchpay.bridge-url=${TOUCHPAY_BRIDGE_URL}
# ── Paiements hors plateforme ──
# Seuls les abonnements se paient dans l'application. Charges et travaux : payés hors Solimus,
# justifiés par une preuve validée par le bénéficiaire (syndic / prestataire). true = réactive le paiement en ligne.
app.payments.charges-online.enabled=${PAYMENTS_CHARGES_ONLINE_ENABLED:false}
app.payments.travaux-online.enabled=${PAYMENTS_TRAVAUX_ONLINE_ENABLED:false}

# ── Prestataires : accès aux demandes de travaux ──
# Solde de wallet STRICTEMENT supérieur à ce montant (FCFA) pour voir les demandes et envoyer un devis
app.provider.min-wallet-balance=${PROVIDER_MIN_WALLET_BALANCE:1000}

# ── Diffusion progressive des demandes de travaux (au plus proche d'abord) ──
# Rayons successifs (km), délai entre deux paliers, arrêt de l'élargissement après N devis (0 = jamais),
# durée maximale de diffusion
app.travaux.broadcast.radii-km=${TRAVAUX_BROADCAST_RADII_KM:5,10,15,20,30}
app.travaux.broadcast.step-minutes=${TRAVAUX_BROADCAST_STEP_MINUTES:10}
app.travaux.broadcast.stop-after-quotes=${TRAVAUX_BROADCAST_STOP_AFTER_QUOTES:3}
app.travaux.broadcast.max-age-hours=${TRAVAUX_BROADCAST_MAX_AGE_HOURS:72}
app.travaux.broadcast.job-delay-ms=${TRAVAUX_BROADCAST_JOB_DELAY_MS:60000}

# ── Abonnements ──
# false (défaut) : abonnements suspendus. Aucun paiement d'abonnement, tous les comptes ont accès à toutes
# les fonctionnalités (pas de formule, pas de limite). true = rétablit les abonnements payants.
app.subscriptions.enabled=${SUBSCRIPTIONS_ENABLED:false}

# ── Commission Solimus sur les travaux ──
# Taux (%) appliqué quand le syndic n'a pas défini le sien (Paramètres > Financier : travauxCommissionRate).
app.travaux.commission.default-rate=${TRAVAUX_COMMISSION_DEFAULT_RATE:0}
# Commission débitée automatiquement du wallet du prestataire à la FIN DES TRAVAUX (une fois par intervention),
# et devis refusé si le wallet ne la couvre pas. false = aucune commission.
app.travaux.commission.enabled=${TRAVAUX_COMMISSION_ENABLED:true}

# ── Recharge du wallet prestataire (paiement hors application, validé par l'admin) ──
app.provider.recharge.min-amount=${PROVIDER_RECHARGE_MIN_AMOUNT:500}
app.provider.recharge.max-amount=${PROVIDER_RECHARGE_MAX_AMOUNT:5000000}
app.provider.recharge.max-pending=${PROVIDER_RECHARGE_MAX_PENDING:3}
# Texte affiché au prestataire : numéro Wave / Orange Money de Solimus, coordonnées bancaires…
app.provider.recharge.instructions=${PROVIDER_RECHARGE_INSTRUCTIONS:Payez Solimus par Wave, Orange Money ou virement, puis envoyez la preuve de paiement. Votre compte est crédité après vérification.}
