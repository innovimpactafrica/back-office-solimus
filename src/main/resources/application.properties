spring.application.name=solimus

# Configuration Base de Données AprEs valeurs rEelles fournies via variables d'environnement
# (fichier .env sur le serveur). Les valeurs aprEs ":" ne sont que des
# exemples de secours, sans rapport avec un environnement rEel.
spring.datasource.url=jdbc:mysql://${DB_HOST:your-db-host.example.com}:${DB_PORT:3306}/${DB_NAME:your_database_name}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USER:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}
server.port=8085

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Configuration Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.example.solimus.controllers
springdoc.show-actuator=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ClE secrEte du token  fournie via JWT_SECRET en production
jwt.secret=${JWT_SECRET:your-jwt-secret-example}

# Temps d'expiration du token 24heures par défaut
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Temps d'expiration du code d'activation lors de l'inscription
activation.code.expiration.minutes=${ACTIVATION_CODE_EXPIRATION_MINUTES:15}
activation.code.resend.cooldown.seconds=${ACTIVATION_CODE_RESEND_COOLDOWN_SECONDS:30}

# ============================================================================
# CONFIGURATION EMAIL
# ============================================================================
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:your-mail-password}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.example.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:your-email@example.com}
mail.app.name=${MAIL_APP_NAME:Solimus}

# Frontend base URL used in emails
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8085}

# Liens d'activation et reset
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/create-password?token=}
app.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:4200/create-password?token=}

# Configuration de la taille maximale des fichiers uploadés (Images , documents, etc.)
# Taille maximale d'un seul fichier
spring.servlet.multipart.max-file-size=10MB
# Taille maximale totale de la requête (fichiers + autres paramètres)
spring.servlet.multipart.max-request-size=20MB

# Configuration MinIO pour les fichiers , images
minio.url=${MINIO_URL:https://minio.example.com}
minio.access-key=${MINIO_ACCESS_KEY:your-minio-access-key}
minio.secret-key=${MINIO_SECRET_KEY:your-minio-secret-key}
minio.bucket=${MINIO_BUCKET:your-bucket-name}

# Configuration Reverse Proxy pour que Swagger génère des liens HTTPS
server.forward-headers-strategy=framework

# Rayon de recherche des prestataires à proximité (en km)
solimus.geolocation.search-radius-km=${GEOLOCATION_SEARCH_RADIUS_KM:30.0}

# ============================================================================
# CONFIGURATION TOUCHPAY
# ============================================================================
touchpay.hosted.script-url=${TOUCHPAY_HOSTED_SCRIPT_URL:https://touchpay.gutouch.net/touchpayv2/script/touchpaynr/prod_touchpay-0.0.1.js}
touchpay.agency-code=${TOUCHPAY_AGENCY_CODE:your-agency-code}
touchpay.token=${TOUCHPAY_TOKEN:your-touchpay-token}
touchpay.hosted.domain-name=${TOUCHPAY_DOMAIN_NAME:example.com}
touchpay.hosted.success-redirect-url=${TOUCHPAY_SUCCESS_REDIRECT_URL:http://localhost:8085/api/payments/intouch/payment-success}
touchpay.hosted.failed-redirect-url=${TOUCHPAY_FAILED_REDIRECT_URL:http://localhost:8085/api/payments/intouch/payment-failed}
touchpay.hosted.default-city=${TOUCHPAY_DEFAULT_CITY:Dakar}
touchpay.callback-url=${TOUCHPAY_CALLBACK_URL:http://localhost:8085/api/payments/intouch/callback}
app.touchpay.bridge-url=${TOUCHPAY_BRIDGE_URL:http://localhost:8085/touchpay-bridge.html?ref=%s&apiBaseUrl=http://localhost:8085}

# Page "Paramètres" de l'app web Angular, espace syndic - destination après un paiement self-service (SYR-)
app.syndic-web-app-redirect-url=${SYNDIC_WEB_APP_REDIRECT_URL:http://localhost:4200/app/parametres}

# Exposition de l'actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.security.enabled=false
# Désactiver tous les indicateurs de santé pour éviter les exceptions
management.health.defaults.enabled=false
