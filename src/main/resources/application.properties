spring.application.name=solimus
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Base de données (même base en local et en prod) ──
spring.datasource.url=jdbc:mysql://${DB_HOST:89.167.72.116}:${DB_PORT:3303}/${DB_NAME:solimus_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool : évite les warnings "Thread starvation" HikariPool de ton terminal
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

server.port=8085

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

logging.level.com.zaxxer.hikari=INFO

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Mail (OVH) ──
spring.mail.host=${MAIL_HOST:ssl0.ovh.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:ssl0.ovh.net}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:contact@solimus.sn}
mail.app.name=${MAIL_APP_NAME:Solimus}

# ── MinIO ──
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# ── TouchPay ──
touchpay.hosted.script-url=${TOUCHPAY_HOSTED_SCRIPT_URL}
touchpay.agency-code=${TOUCHPAY_AGENCY_CODE}
touchpay.token=${TOUCHPAY_TOKEN}
touchpay.hosted.domain-name=${TOUCHPAY_DOMAIN_NAME:solimus.sn}
touchpay.hosted.success-redirect-url=${TOUCHPAY_SUCCESS_REDIRECT_URL}
touchpay.hosted.failed-redirect-url=${TOUCHPAY_FAILED_REDIRECT_URL}
touchpay.hosted.default-city=${TOUCHPAY_DEFAULT_CITY:Dakar}
touchpay.callback-url=${TOUCHPAY_CALLBACK_URL}
app.touchpay.bridge-url=${TOUCHPAY_BRIDGE_URL}